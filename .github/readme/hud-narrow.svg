@keyframes blip { from, to { opacity: 1; } }
.halo { animation: pulse 2s steps(4) infinite; }
@keyframes pulse { 0% { opacity: 0.45; } 100% { opacity: 0; } }
.n0 { animation: blip 0.18s steps(1) 0.00s; }
.n1 { animation: blip 0.18s steps(1) 0.18s; }
