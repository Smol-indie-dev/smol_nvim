.nf { animation: show 1ms 0.72s backwards; }
.lang { transform-box: fill-box; transform-origin: left; animation: grow 1.2s steps(12) 0.4s backwards; }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
